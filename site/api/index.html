<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRVS API Reference</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
  <style>
    body { margin: 0; background: #fff; }
    .back { display: block; padding: 10px 16px; font: 14px system-ui, sans-serif; border-bottom: 1px solid #e2e1dc; }
    .back a { color: #1f5f8b; }
  </style>
</head>
<body>
  <div class="back"><a href="../">← CRVS compliance</a></div>
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-standalone-preset.js"></script>
  <script>
    // Two specs: the published DCI CRVS API, and the same API on the local mock paths/ports.
    // ?spec=mock opens the mock spec directly.
    const mockFirst = new URLSearchParams(location.search).get('spec') === 'mock';
    window.ui = SwaggerUIBundle({
      urls: [
        { url: 'crvs_api_v1.0.0.yaml', name: 'DCI CRVS API v1.0.0 (standard)' },
        { url: 'crvs_api_v1.0.0-mock.yaml', name: 'CRVS mock (local, try it out)' },
      ],
      'urls.primaryName': mockFirst ? 'CRVS mock (local, try it out)' : 'DCI CRVS API v1.0.0 (standard)',
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'StandaloneLayout',
    });
  </script>
</body>
</html>
